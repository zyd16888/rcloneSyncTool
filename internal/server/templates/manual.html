{{define "content"}}
<div class="app-form">
  <div class="page-heading"><div><h1>手动运行</h1><p class="page-description">为本次目录准备清单，按当前设置提交传输任务</p></div><a class="btn btn-sm btn-ghost" href="/jobs">{{icon "arrow-left"}}查看任务</a></div>
  {{if .Error}}<div class="alert alert-warning mb-5">{{.Error}}</div>{{end}}
  <form method="post" action="/manual/start" data-ui-form data-edit-form data-draft-form>
    <div class="app-tabs" role="tablist" aria-label="手动任务配置"><button class="app-tab active" type="button" data-form-tab="basic" role="tab" aria-selected="true" aria-controls="manualBasic">传输目录</button><button class="app-tab" type="button" data-form-tab="policy" role="tab" aria-selected="false" aria-controls="manualPolicy">同步策略</button><button class="app-tab" type="button" data-form-tab="advanced" role="tab" aria-selected="false" aria-controls="manualAdvanced">限速与高级</button></div>
    <section id="manualBasic" class="app-form-panel" data-form-panel="basic" role="tabpanel">
      {{if .Rules}}<label class="app-field mb-6">复用已有规则配置<select class="select" data-template-navigation="/manual?copy_from_id="><option value="">选择规则模板</option>{{range .Rules}}<option value="{{.ID}}" {{if eq .ID $.Rule.ID}}selected{{end}}>{{.ID}}</option>{{end}}</select><span class="app-field-help">本次任务独立执行，目录可继续调整</span></label>{{end}}
      {{template "source_fields" .}}
    </section>
    <section id="manualPolicy" class="app-form-panel" data-form-panel="policy" role="tabpanel" hidden>{{template "sync_policy_fields" .}}</section>
    <section id="manualAdvanced" class="app-form-panel" data-form-panel="advanced" role="tabpanel" hidden>{{template "advanced_rule_fields" .}}</section>
    <div class="alert alert-error app-form-feedback" data-form-feedback hidden role="alert"></div>
    <footer class="app-savebar"><span data-draft-state>提交后可在任务详情中查看执行状态</span><div class="page-actions"><button type="button" class="btn btn-sm btn-ghost" data-form-reset>重置更改</button><button type="submit" class="btn btn-sm btn-primary">{{icon "play"}}提交任务</button></div></footer>
  </form>
</div>
{{end}}
