{{define "content"}}
<div class="app-form">
  <div class="page-heading"><div><h1>系统设置</h1><p class="page-description">配置连接、全局传输参数与管理台访问</p></div><button class="btn btn-sm" type="button" id="btnCheck">{{icon "shield"}}检测 rclone</button></div>
  <form method="post" action="/settings/save" data-ui-form data-edit-form data-draft-form>
    <div class="app-tabs" role="tablist" aria-label="系统设置"><button class="app-tab active" data-form-tab="basic" type="button" role="tab" aria-selected="true" aria-controls="settingsBasic">连接与常规</button><button class="app-tab" data-form-tab="transfer" type="button" role="tab" aria-selected="false" aria-controls="settingsTransfer">传输参数</button><button class="app-tab" data-form-tab="advanced" type="button" role="tab" aria-selected="false" aria-controls="settingsAdvanced">调度与高级</button><button class="app-tab" data-form-tab="account" type="button" role="tab" aria-selected="false" aria-controls="settingsAccount">管理台访问</button></div>
    <section class="app-form-panel" id="settingsBasic" data-form-panel="basic" role="tabpanel"><div class="app-form-grid">
      <label class="app-field app-field-wide">rclone 配置路径<input name="rclone_config_path" value="{{index .S "rclone_config_path"}}" class="input" placeholder="留空使用 rclone 默认配置"><span class="app-field-help app-wrap">当前路径：{{.RcloneConfigPathDisplay}}</span></label>
      <label class="app-field">系统总并发<input name="global_max_jobs" value="{{index .S "global_max_jobs"}}" type="number" min="0" max="10000" class="input" placeholder="0 表示不限"><span class="app-field-help">所有规则及手动、API 任务共用</span></label>
      <label class="app-field">日志保留天数<input name="log_retention_days" value="{{index .S "log_retention_days"}}" type="number" min="0" max="3650" class="input"><span class="app-field-help">0 不自动清理；运行中的任务会保留</span></label>
      <label class="app-field app-field-wide">默认传输速度上限<input name="rclone_bwlimit" value="{{index .S "rclone_bwlimit"}}" class="input" placeholder="例如 40M，留空不限"><span class="app-field-help">规则可以单独覆盖此设置</span></label>
    </div><p class="app-field-help mt-6 app-wrap">日志目录：{{.LogDir}}</p></section>
    <section class="app-form-panel" id="settingsTransfer" data-form-panel="transfer" role="tabpanel" hidden><div class="app-form-grid">
      <label class="app-field">每个任务同时传输文件数<input name="rclone_transfers" value="{{index .S "rclone_transfers"}}" type="number" min="1" max="1000" class="input"><span class="app-field-help">rclone transfers</span></label>
      <label class="app-field">每个任务同时检查文件数<input name="rclone_checkers" value="{{index .S "rclone_checkers"}}" type="number" min="1" max="1000" class="input"><span class="app-field-help">rclone checkers</span></label>
      <label class="app-field">文件缓冲大小<input name="rclone_buffer_size" value="{{index .S "rclone_buffer_size"}}" class="input" placeholder="例如 64M"><span class="app-field-help">rclone buffer-size</span></label>
      <label class="app-field">Google Drive 上传分块大小<input name="rclone_drive_chunk_size" value="{{index .S "rclone_drive_chunk_size"}}" class="input" placeholder="例如 64M"><span class="app-field-help">rclone drive-chunk-size</span></label>
    </div></section>
    <section class="app-form-panel" id="settingsAdvanced" data-form-panel="advanced" role="tabpanel" hidden><div class="app-form-grid">
      <label class="app-field">RC 起始端口<input name="rc_port_start" value="{{index .S "rc_port_start"}}" type="number" min="1" max="65535" class="input"></label>
      <label class="app-field">RC 结束端口<input name="rc_port_end" value="{{index .S "rc_port_end"}}" type="number" min="1" max="65535" class="input"><span class="app-field-help">任务在端口范围内独立统计</span></label>
      <label class="app-field">统计采样间隔<input name="metrics_interval_ms" value="{{index .S "metrics_interval_ms"}}" type="number" min="100" max="3600000" class="input"><span class="app-field-help">毫秒</span></label>
      <label class="app-field">调度检查间隔<input name="scheduler_tick_ms" value="{{index .S "scheduler_tick_ms"}}" type="number" min="100" max="3600000" class="input"><span class="app-field-help">毫秒</span></label>
      <label class="app-field">单次扫描超时<input name="scan_timeout_sec" value="{{index .S "scan_timeout_sec"}}" type="number" min="1" max="86400" class="input" placeholder="默认 600"><span class="app-field-help">秒</span></label>
      <label class="app-field app-field-wide">允许的回调接收端<input name="callback_allowed_hosts" value="{{index .S "callback_allowed_hosts"}}" class="input" placeholder="workflow.example.com, 192.168.1.10:8080"><span class="app-field-help">可选；多个接收端用逗号分隔</span></label>
    </div></section>
    <section class="app-form-panel" id="settingsAccount" data-form-panel="account" role="tabpanel" hidden><div class="app-form-grid">
      <label class="app-field">管理台新密码<input name="ui_password" type="password" class="input" autocomplete="new-password" placeholder="留空保持当前密码"><span class="app-field-help">修改后需要重新登录</span></label>
      <label class="app-field">确认新密码<input name="ui_password2" type="password" class="input" autocomplete="new-password" placeholder="再次输入新密码"></label>
    </div></section>
    <div class="alert alert-error app-form-feedback" data-form-feedback hidden role="alert"></div>
    <footer class="app-savebar"><span data-draft-state>设置将在保存后生效</span><div class="page-actions"><button type="button" class="btn btn-sm btn-ghost" data-form-reset>重置更改</button><button type="submit" class="btn btn-sm btn-primary">{{icon "check"}}保存设置</button></div></footer>
  </form>
</div>
<dialog id="rcloneModal" class="modal" aria-labelledby="rcloneModalTitle"><div class="modal-box max-w-3xl"><h3 id="rcloneModalTitle" class="font-semibold text-lg">rclone 检测</h3><div id="rcloneModalBody" class="app-mono app-wrap whitespace-pre-wrap mt-4"></div><div class="modal-action"><form method="dialog"><button class="btn" type="submit">关闭</button></form></div></div></dialog>
<script>
document.getElementById('btnCheck').addEventListener('click',async()=>{
  const dialog=document.getElementById('rcloneModal'),body=document.getElementById('rcloneModalBody');
  body.textContent='检测中…';dialog.showModal();
  try{const response=await fetch('/api/rclone/check');if(!response.ok)throw new Error('检测请求失败');const data=await response.json();
    body.textContent=data.installed?'版本：'+(data.version||data.versionError||'—')+'\n配置：'+(data.configPathDisplay||'—')+'\n可用连接：\n'+((data.remotes||[]).join('\n')||data.remotesError||'暂无连接'):(data.hint||'未检测到 rclone');
  }catch(error){body.textContent=error.message;}
});
</script>
{{end}}
