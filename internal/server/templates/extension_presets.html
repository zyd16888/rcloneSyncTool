{{define "content"}}
<div class="page-heading"><div><h1>扩展名预设</h1><p class="page-description">维护常用过滤扩展名，在规则和手动任务中快速添加</p></div><a class="btn btn-sm btn-ghost" href="/rules">{{icon "arrow-left"}}同步规则</a></div>
<form class="app-form-panel mb-5" method="post" action="/extension_presets/save" data-ui-form data-refresh-page data-edit-form>
  <h2 class="app-section-title">新建 / 编辑预设</h2><div class="app-form-grid"><label class="app-field">预设名称<input name="name" class="input" required placeholder="例如：网页文件"></label><label class="app-field">扩展名<input name="extensions" class="input" required placeholder=".url .html .htm"><span class="app-field-help">使用空格分隔</span></label></div><div class="alert alert-error app-form-feedback" data-form-feedback hidden role="alert"></div><div class="page-actions justify-end mt-5"><button class="btn btn-sm btn-ghost" type="button" data-form-reset>重置更改</button><button class="btn btn-sm btn-primary" type="submit">{{icon "check"}}保存预设</button></div>
</form>
<div class="app-table-wrap"><table class="table"><thead><tr><th>名称</th><th>扩展名</th><th>操作</th></tr></thead><tbody>{{range .Presets}}<tr><td class="font-semibold app-wrap">{{.Name}}</td><td class="app-mono app-wrap">{{.Extensions}}</td><td><div class="app-inline"><button class="btn btn-xs btn-ghost" type="button" data-edit-preset="{{.Name}}" data-extensions="{{.Extensions}}">{{icon "edit"}}编辑</button><form method="post" action="/extension_presets/delete" data-ui-form data-refresh-page data-confirm-title="删除预设“{{.Name}}”？" data-confirm-message="已经保存到规则中的扩展名不受影响。" data-confirm-label="删除预设"><input name="name" value="{{.Name}}" type="hidden"><button class="btn btn-xs btn-ghost text-error" type="submit" aria-label="删除预设 {{.Name}}">{{icon "close"}}</button></form></div></td></tr>{{else}}<tr><td colspan="3"><div class="app-empty">{{icon "filter"}}<div class="app-empty-title">暂无预设</div><p class="app-empty-desc">添加常用扩展名组合后，可在规则配置中复用。</p></div></td></tr>{{end}}</tbody></table></div>
<script>
document.querySelectorAll('[data-edit-preset]').forEach(button=>button.addEventListener('click',async()=>{
  const form=document.querySelector('form[action="/extension_presets/save"]');
  if(form.dataset.dirty==='1'&&!await App.confirm({title:'载入另一预设？',message:'当前未保存的更改会被替换。',label:'载入',danger:false}))return;
  form.elements.name.value=button.dataset.editPreset;form.elements.extensions.value=button.dataset.extensions;App.forms.markClean(form);form.dispatchEvent(new Event('input',{bubbles:true}));form.scrollIntoView({block:'nearest'});
}));
</script>
{{end}}
