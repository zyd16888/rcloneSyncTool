{{define "content"}}
<div class="page-heading"><div><h1>远程连接</h1><p class="page-description">当前 rclone 配置中可用于同步的连接</p></div><div class="page-actions"><a class="btn btn-sm" href="/rclone/config">{{icon "file"}}编辑配置</a><a class="btn btn-sm btn-primary" href="/rules/edit">{{icon "plus"}}创建规则</a></div></div>
{{if .Error}}<div class="alert alert-warning mb-5" role="alert">{{icon "warning"}}<span>读取连接失败：{{.Error}}</span></div>{{end}}
<div class="app-table-wrap"><table class="table"><thead><tr><th>连接名称</th><th>用于同步</th><th>操作</th></tr></thead><tbody>{{range .Remotes}}<tr><td class="font-semibold app-wrap">{{.}}</td><td><span class="status">rclone remote</span></td><td><button class="btn btn-xs btn-ghost" type="button" data-copy="{{.}}" data-copy-label="连接名称">{{icon "copy"}}复制名称</button></td></tr>{{else}}<tr><td colspan="3"><div class="app-empty">{{icon "cloud"}}<div class="app-empty-title">暂无连接</div><p class="app-empty-desc">配置 remote 后刷新此页，即可在同步规则中选择。</p><a class="btn btn-sm btn-primary" href="/rclone/config">打开 rclone 配置</a></div></td></tr>{{end}}</tbody></table></div>
{{end}}
