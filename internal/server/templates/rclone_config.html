{{define "content"}}
<div class="space-y-4">
  <div class="page-heading">
    <div>
      <h1>rclone 配置</h1>
      <div class="page-description">编辑当前使用的连接配置</div>
    </div>
    <div class="flex gap-2">
      <a class="btn btn-sm btn-ghost" href="/settings">系统设置</a>
    </div>
  </div>

  {{if .Error}}
  <div class="alert alert-error">
    <span>{{.Error}}</span>
  </div>
  {{end}}

  {{if .Path}}
  <div class="alert">
    <span>
      <b>路径：</b><code>{{.Path}}</code>
      <span class="opacity-70">（来源：{{.PathSource}}）</span>
    </span>
  </div>
  {{end}}

  {{if .ReadError}}
  <div class="alert alert-warning">
    <span><b>无法读取配置文件：</b>{{.ReadError}}<br>如果你在 Docker 中运行，请确保该文件已经在挂载卷里存在（例如先在宿主机创建）。</span>
  </div>
  {{end}}

  <div class="card bg-base-100 border border-base-200">
    <div class="card-body">
      <form method="post" action="/rclone/config/save" class="space-y-3" data-edit-form data-ui-form>
        <label class="form-control">
          <div class="label"><span class="label-text">内容</span></div>
          <textarea name="content" rows="22" class="textarea app-mono w-full" data-draft-skip style="min-height:420px;height:auto;" placeholder="在这里编辑 rclone.conf">{{.Content}}</textarea>
          <div class="label"><span class="label-text-alt opacity-70">保存会直接覆盖现有文件（建议先自行备份）。</span></div>
        </label>
        <div class="alert alert-error app-form-feedback" data-form-feedback hidden role="alert"></div>
        <div class="app-savebar">
          <span data-draft-state>配置修改将在保存后生效</span><div class="page-actions"><a class="btn btn-sm btn-ghost" href="/remotes">查看连接</a><button class="btn btn-sm btn-primary" type="submit">{{icon "check"}}保存配置</button></div>
        </div>
      </form>
    </div>
  </div>
</div>
{{end}}
