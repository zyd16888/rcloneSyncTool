{{define "content"}}
<div class="app-login"><div class="app-login-panel">
  <div class="app-login-brand"><span class="app-brand-mark">{{icon "sync"}}</span>rclone Sync</div>
  <h1 class="text-xl font-semibold">{{if .HasPassword}}登录同步工作台{{else}}设置管理台密码{{end}}</h1><p class="page-description mb-6">{{if .HasPassword}}使用管理台密码查看和管理同步任务{{else}}首次使用，设置密码后进入同步工作台{{end}}</p>
  {{if .Error}}<div class="alert alert-error mb-5" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login"><input name="next" value="{{.Next}}" type="hidden"><label class="app-field">密码<input name="password" type="password" class="input" autocomplete="{{if .HasPassword}}current-password{{else}}new-password{{end}}" required placeholder="{{if .HasPassword}}请输入密码{{else}}设置新密码{{end}}"></label>
  {{if not .HasPassword}}<label class="app-field mt-4">确认密码<input name="password2" type="password" class="input" autocomplete="new-password" required placeholder="再次输入新密码"></label>{{end}}
  <button class="btn btn-primary w-full mt-6" type="submit">{{if .HasPassword}}登录{{else}}保存并进入{{end}} {{icon "arrow-right"}}</button></form>
</div></div>
{{end}}
